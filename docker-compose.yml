version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: notes_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: notes_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: notes_ctf
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - notes_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes_user -d notes_ctf"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notes_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://notes_user:${DB_PASSWORD}@postgres:5432/notes_ctf?schema=public
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      FLAG: ${FLAG}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - notes_network
    command: >
      sh -c "
        npx prisma migrate deploy &&
        npx prisma db seed &&
        node server.js
      "

volumes:
  postgres_data:

networks:
  notes_network:
    driver: bridge
